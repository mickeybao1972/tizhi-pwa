<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#4A7C59"/>
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#3A6147"/>
  <!-- ECG waveform -->
  <polyline points="60,256 160,256 190,180 210,330 230,100 250,400 270,256 350,256 452,256"
    fill="none" stroke="#7EC89A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Heart dot -->
  <circle cx="250" cy="256" r="18" fill="#C49A6C"/>
  <!-- Small pulse markers -->
  <circle cx="60" cy="256" r="6" fill="#6B9E7A"/>
  <circle cx="452" cy="256" r="6" fill="#6B9E7A"/>
  <!-- Top decoration -->
  <text x="256" y="76" text-anchor="middle" font-size="48" font-weight="bold"
    fill="#F8F4EE" font-family="sans-serif">四诊</text>
</svg>