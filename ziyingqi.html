<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f5f5; color: #333; padding: 10px; font-size: 13px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 18px; text-align: center; margin: 6px 0; color: #8B4513; }
  .subtitle { text-align: center; font-size: 11px; color: #999; margin-bottom: 10px; }

  .mode-tabs button.active { background: #8B4513; color: #fff; }
  .err { color: #c62828; font-size: 12px; margin-top: 6px; }
  
  /* 命盘 */

  .bazi-pan th, .bazi-pan td { border: 1px solid #e0e0e0; padding: 5px 4px; text-align: center; }

  .bazi-pan .cang { font-size: 10px; color: #666; line-height: 1.3; }
  .bazi-pan .ss { font-size: 10px; color: #8B4513; }
  
  .mu { color: #228B22; }
  .huo { color: #DC143C; }
  .tu { color: #B8860B; }
  .jin { color: #B8860B; }
  .shui { color: #1E90FF; }
  
  /* 120年干支矩阵 - 核心表格 */
  .matrix-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; table-layout: fixed; }
  .matrix-table th, .matrix-table td { border: 1px solid #ddd; padding: 0; text-align: center; vertical-align: middle; height: 44px; }
  .matrix-table th { background: #fafafa; color: #666; font-weight: normal; font-size: 11px; }
  .matrix-table th.row-head { background: #fafafa; color: #666; width: 30px; }
  .matrix-table th.col-head { background: #fafafa; }
  
  .cell { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2px; position: relative; }
  .cell-gan { font-size: 10px; line-height: 1; }
  .cell-year { font-size: 10px; color: #999; line-height: 1.2; }
  .cell-zhi { font-size: 14px; font-weight: bold; line-height: 1.2; }
  
  /* 子女星标注 */
  .cell.has-star-gan { background: #FFEBEE; }
  .cell.has-star-zhi { background: #E3F2FD; }
  .cell.has-star-both { background: #FCE4EC; }
  .cell.current { border: 2px solid #FF9800; }
  .cell.dy-current { box-shadow: inset 0 0 0 2px #4CAF50; }
  
  .star-mark { position: absolute; top: 1px; right: 1px; font-size: 9px; }
  .star-mark-gan { color: #C62828; }
  .star-mark-zhi { color: #1565C0; }
  
  .legend { font-size: 11px; color: #666; margin-top: 8px; padding: 8px; background: #fafafa; border-radius: 4px; }
  .legend-item { display: inline-block; margin-right: 14px; }
  .legend-color { display: inline-block; width: 12px; height: 12px; vertical-align: middle; margin-right: 3px; border: 1px solid #ddd; }
  
  .info-row { display: flex; gap: 16px; font-size: 12px; color: #666; margin: 8px 0; flex-wrap: wrap; }
  .info-row span b { color: #8B4513; }
  
  .signal-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .signal-tag { background: #FFEBEE; border: 1px solid #EF9A9A; border-radius: 10px; padding: 3px 8px; font-size: 11px; color: #C62828; }
  .signal-tag-zhi { background: #E3F2FD; border-color: #90CAF9; color: #1565C0; }
  
  details { margin-top: 8px; font-size: 12px; }
  details summary { cursor: pointer; color: #8B4513; }
</style>
</head>
<body>
<div class="wrap">

  <h1>八字排盘 · 子女应期</h1>
  <div class="subtitle">V2.2 · 120年干支矩阵 · 天干地支子女星分标 · 男官杀/女食伤</div>

  <div class="notice">
    传统命理民俗研究参考。男命子女星=官杀（正官/七杀），女命子女星=食伤（食神/伤官）。<b>红底=天干有子女星，蓝底=地支藏干有子女星，粉底=干支均有</b>。
  </div>

  <div class="card">
    <div class="mode-tabs">
      <button id="tab-solar" class="active">阳历</button>
      <button id="tab-lunar">阴历</button>
    </div>
    <div class="row">
      <div class="field year"><label>年</label><input id="in-y" value="1990"></div>
      <div class="field small"><label>月</label><input id="in-m" value="1"></div>

        <label>闰月</label><select id="in-leap"><option value="0">否</option><option value="1">是</option></select>

      <div class="field small"><label>时</label><input id="in-h" value="12"></div>

        <label>性别</label>
        <select id="in-gender"><option value="男">男</option><option value="女">女</option></select>
      </div>
      <div class="field">
        <label>地点</label>
        <select id="in-city">
          <option value="116.4" selected>北京</option>
          <option value="121.5">上海</option>
          <option value="114.1">香港</option>
          <option value="120.7">台北</option>
        </select>
      </div>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;margin-bottom:0">
        <input type="checkbox" id="in-truesolar" checked> 真太阳时
      </label>
      <button class="btn" id="btn-run">排盘</button>

    <div class="err" id="err-box" style="display:none"></div>
    
    <details>
      <summary>高级：直接输入四柱</summary>
      <div class="row" style="margin-top:8px">
        <div class="field"><input id="in-sizhu" placeholder="己巳 丙子 丙寅 甲午" style="width:160px"></div>
        <div class="field year"><input id="in-byear" value="1990"></div>
        <button class="btn gray" id="btn-run2">推演</button>
      </div>
    </details>
  </div>

  <div id="result-area"></div>
</div>

<script src="lunar.js"></script>
<script>
"use strict";

const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const GAN_WX = {'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
const CANG = {
  '子':['癸'], '丑':['己','癸','辛'], '寅':['甲','丙','戊'], '卯':['乙'],
  '辰':['戊','乙','癸'], '巳':['丙','庚','戊'], '午':['丁','己'], '未':['己','丁','乙'],
  '申':['庚','壬','戊'], '酉':['辛'], '戌':['戊','辛','丁'], '亥':['壬','甲']
};
const SHENG = {'木':'火','火':'土','土':'金','金':'水','水':'木'};
const KE = {'木':'土','土':'水','水':'火','火':'金','金':'木'};
const WX_CLS = {'木':'mu','火':'huo','土':'tu','金':'jin','水':'shui'};
const CHONG = {'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};

function tenGod(dayGan, g) {
  const dw = GAN_WX[dayGan], ow = GAN_WX[g];
  const same = (GAN.indexOf(dayGan) % 2) === (GAN.indexOf(g) % 2);
  if (ow === dw) return same ? '比肩' : '劫财';
  if (SHENG[dw] === ow) return same ? '食神' : '伤官';
  if (KE[dw] === ow) return same ? '偏财' : '正财';
  if (KE[ow] === dw) return same ? '七杀' : '正官';
  return same ? '偏印' : '正印';
}

function yearGanzhi(y) {
  const idx = ((y - 4) % 60 + 60) % 60;
  return GAN[idx % 10] + ZHI[idx % 12];
}

function jiaziIndex(g, z) {
  return ((6 * GAN.indexOf(g) - 5 * ZHI.indexOf(z)) % 60 + 60) % 60;
}

function trueSolarTime(solar, lng) {
  const N = Math.floor((Date.UTC(solar.getYear(), solar.getMonth() - 1, solar.getDay()) - Date.UTC(solar.getYear(), 0, 1)) / 86400000) + 1;
  const B = 2 * Math.PI * (N - 81) / 364;
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const offsetMin = (lng - 120) * 4 + eot;
  const totalMin = solar.getHour() * 60 + solar.getMinute() + offsetMin;
  const dayOffset = Math.floor(totalMin / 1440);
  const rem = ((totalMin % 1440) + 1440) % 1440;
  const base = solar.next(dayOffset);
  return { solar: Solar.fromYmdHms(base.getYear(), base.getMonth(), base.getDay(), Math.floor(rem / 60), Math.floor(rem % 60), 0), offsetMin, dayShift: dayOffset };
}

function buildPillars(opt) {
  let solar;
  if (opt.solar) {
    let s = Solar.fromYmdHms(opt.solar.y, opt.solar.m, opt.solar.d, opt.solar.h, opt.solar.min, 0);
    if (opt.useTrueSolar && opt.lng) {
      const t = trueSolarTime(s, opt.lng);
      solar = t.solar;
    } else solar = s;
  } else {
    const lun = Lunar.fromYmd(opt.lunar.y, opt.lunar.m, opt.lunar.d, opt.lunar.leap ? 1 : 0);
    const s0 = lun.getSolar();
    let s = Solar.fromYmdHms(s0.getYear(), s0.getMonth(), s0.getDay(), opt.lunar.h, opt.lunar.min, 0);
    if (opt.useTrueSolar && opt.lng) {
      const t = trueSolarTime(s, opt.lng);
      solar = t.solar;
    } else solar = s;
  }
  const lunar = solar.getLunar();
  const ec = lunar.getEightChar();
  const gzs = [ec.getYear(), ec.getMonth(), ec.getDay(), ec.getTime()];
  const pillars = gzs.map(gz => ({ gan: gz[0], zhi: gz[1], ganWx: GAN_WX[gz[0]] }));
  return { pillars, birthYear: solar.getYear(), ec };
}

function getChildStars(dayGan, gender) {
  // 男：官杀（七杀=儿子, 正官=女儿）；女：食伤（食神=儿子, 伤官=女儿）
  return gender === '男' ? ['正官', '七杀'] : ['食神', '伤官'];
}

// 检查某个干支是否含子女星
function checkGZ(dayGan, gz, gender) {
  const stars = getChildStars(dayGan, gender);
  const ganSS = tenGod(dayGan, gz[0]);
  const ganHas = stars.includes(ganSS);
  
  const cang = CANG[gz[1]] || [];
  const zhiHas = cang.some(c => stars.includes(tenGod(dayGan, c)));
  
  return { ganHas, zhiHas, both: ganHas && zhiHas, ganSS };
}

function renderPan(pillars, dayGan) {
  let html = '<table class="bazi-pan">';
  html += '<tr><th></th><th>年柱</th><th>月柱</th><th>日柱</th><th>时柱</th></tr>';
  
  html += '<tr><td class="label">天干/十神</td>';
  for (let p of pillars) {
    const ss = tenGod(dayGan, p.gan);
    const cls = WX_CLS[p.ganWx];
    html += '<td><div class="gan ' + cls + '">' + p.gan + '</div><div class="ss">' + ss + '</div></td>';
  }
  html += '</tr>';
  
  html += '<tr><td class="label">地支</td>';
  for (let p of pillars) {
    html += '<td><div class="gan">' + p.zhi + '</div></td>';
  }
  html += '</tr>';
  
  html += '<tr><td class="label">藏干</td>';
  for (let p of pillars) {
    const cang = CANG[p.zhi] || [];
    let c = '';
    for (let cg of cang) c += cg + tenGod(dayGan, cg) + '<br>';
    html += '<td class="cang">' + c + '</td>';
  }
  html += '</tr>';
  
  html += '</table>';
  return html;
}

// 120年矩阵：行=地支(12)，列=天干(10)
// 第一行第一列 = 起运第一年的干支
function renderMatrix(birthYear, qiyunYear, dayGan, gender) {
  const now = new Date().getFullYear();
  const stars = getChildStars(dayGan, gender);
  
  let html = '<table class="matrix-table">';
  
  // 表头：天干
  html += '<tr><th class="row-head"></th>';
  for (let g of GAN) {
    const cls = WX_CLS[GAN_WX[g]];
    html += '<th class="col-head ' + cls + '">' + g + '</th>';
  }
  html += '</tr>';
  
  // 矩阵：每行一个地支，每列一个天干
  for (let z of ZHI) {
    html += '<tr>';
    html += '<th class="row-head">' + z + '</th>';
    
    for (let g of GAN) {
      const gz = g + z;
      const idx = jiaziIndex(g, z);
      const year = qiyunYear + idx;
      const check = checkGZ(dayGan, gz, gender);
      
      let cellClass = 'cell';
      if (check.both) cellClass += ' has-star-both';
      else if (check.ganHas) cellClass += ' has-star-gan';
      else if (check.zhiHas) cellClass += ' has-star-zhi';
      
      if (year === now) cellClass += ' current';
      
      const yearValid = year <= birthYear + 119;
      
      html += '<td>';
      if (yearValid) {
        html += '<div class="' + cellClass + '">';
        html += '<div class="cell-year">' + year + '</div>';
        html += '<div class="cell-gan">' + g + '</div>';
        html += '<div class="cell-zhi">' + z + '</div>';
        if (check.ganHas) html += '<span class="star-mark star-mark-gan">★</span>';
        if (check.zhiHas) html += '<span class="star-mark star-mark-zhi" style="top:auto;bottom:1px">' + (check.ganHas ? '' : '☆') + '</span>';
        html += '</div>';
      } else {
        html += '<div class="cell" style="opacity:0.3">';
        html += '<div class="cell-gan">' + g + '</div>';
        html += '<div class="cell-zhi">' + z + '</div>';
        html += '</div>';
      }
      html += '</td>';
    }
    html += '</tr>';
  }
  
  html += '</table>';
  return html;
}

// 统计高信号年份（天干+地支都有子女星）
function getHighSignals(birthYear, qiyunYear, dayGan, gender) {
  const signals = [];
  const now = new Date().getFullYear();
  
  for (let z of ZHI) {
    for (let g of GAN) {
      const gz = g + z;
      const idx = jiaziIndex(g, z);
      const year = qiyunYear + idx;
      if (year > birthYear + 119) continue;
      const check = checkGZ(dayGan, gz, gender);
      if (check.ganHas || check.zhiHas) {
        signals.push({
          year, gz, age: year - birthYear + 1,
          ganHas: check.ganHas, zhiHas: check.zhiHas,
          starSS: check.ganSS,
          isCurrent: year === now
        });
      }
    }
  }
  signals.sort((a, b) => a.year - b.year);
  return signals;
}

function run() {
  const errBox = document.getElementById('err-box');
  errBox.style.display = 'none';
  
  const y = parseInt(document.getElementById('in-y').value);
  const m = parseInt(document.getElementById('in-m').value);
  const d = parseInt(document.getElementById('in-d').value);
  const h = parseInt(document.getElementById('in-h').value);
  const min = parseInt(document.getElementById('in-min').value) || 0;
  const gender = document.getElementById('in-gender').value;
  const lng = parseFloat(document.getElementById('in-city').value) || null;
  const useTrue = document.getElementById('in-truesolar').checked;
  const isLunar = document.getElementById('tab-lunar').classList.contains('active');
  
  if (!y || !m || !d) { errBox.textContent = '请填写完整日期'; errBox.style.display = 'block'; return; }
  
  let opt = { gender, lng, useTrueSolar: useTrue };
  if (isLunar) {
    const leap = document.getElementById('in-leap').value === '1';
    opt.lunar = { y, m, d, leap, h, min };
  } else {
    opt.solar = { y, m, d, h, min };
  }
  
  try {
    const birth = buildPillars(opt);
    const dayGan = birth.pillars[2].gan;
    
    // 起运年份：直接用 lunar.js 的 DaYun
    const yun = birth.ec.getYun(gender === '男' ? 1 : 0);
    const firstDy = yun.getDaYun()[0];
    const qiyunYear = firstDy.getStartYear(); // 起运开始年
    
    // 子女星
    const stars = getChildStars(dayGan, gender);
    const starDesc = gender === '男' ? '正官/七杀（女儿/儿子）' : '食神/伤官（女儿/儿子）';
    
    // 信号列表
    const signals = getHighSignals(birth.birthYear, qiyunYear, dayGan, gender);
    
    let html = '';
    
    // 命盘
    html += '<div class="card"><h2>基本命盘</h2>';
    html += renderPan(birth.pillars, dayGan);
    html += '<div class="info-row">';
    html += '<span>日主：<b>' + dayGan + '</b>（' + GAN_WX[dayGan] + '）</span>';
    html += '<span>子女宫：<b>' + birth.pillars[3].zhi + '</b></span>';
    html += '<span>起运年：<b>' + qiyunYear + '</b></span>';
    html += '<span>流派：<b>' + starDesc + '</b></span>';
    html += '</div>';
    html += '</div>';
    
    // 120年矩阵
    html += '<div class="card"><h2>120年子女星矩阵</h2>';
    html += '<div style="font-size:11px;color:#666;margin-bottom:6px">行=地支，列=天干，左上角为起运第一年。每格显示年/天干/地支。</div>';
    html += renderMatrix(birth.birthYear, qiyunYear, dayGan, gender);
    html += '<div class="legend">';
    html += '<span class="legend-item"><span class="legend-color" style="background:#FFEBEE"></span>天干透子女星</span>';
    html += '<span class="legend-item"><span class="legend-color" style="background:#E3F2FD"></span>地支藏子女星</span>';
    html += '<span class="legend-item"><span class="legend-color" style="background:#FCE4EC"></span>干支均有</span>';
    html += '<span class="legend-item"><span class="legend-color" style="border:2px solid #FF9800"></span>今年</span>';
    html += '</div>';
    html += '</div>';
    
    // 信号列表
    if (signals.length > 0) {
      html += '<div class="card"><h2>子女星年份一览（共' + signals.length + '年）</h2>';
      html += '<div class="signal-list">';
      for (let s of signals) {
        const cls = s.ganHas && s.zhiHas ? '' : (s.ganHas ? '' : 'signal-tag-zhi');
        html += '<span class="signal-tag ' + cls + '">' + s.year + '年 ' + s.gz + ' ' + s.age + '岁</span>';
      }
      html += '</div></div>';
    }
    
    document.getElementById('result-area').innerHTML = html;
    
  } catch (e) {
    errBox.textContent = '排盘错误: ' + e.message;
    errBox.style.display = 'block';
    console.error(e);
  }
}

function runSizhu() {
  const errBox = document.getElementById('err-box');
  errBox.style.display = 'none';
  
  const sizhu = document.getElementById('in-sizhu').value.trim();
  const byear = parseInt(document.getElementById('in-byear').value) || 1990;
  const gender = document.getElementById('in-gender').value;
  
  if (!sizhu) { errBox.textContent = '请输入四柱'; errBox.style.display = 'block'; return; }
  
  const parts = sizhu.split(/\s+/);
  if (parts.length !== 4) { errBox.textContent = '四柱格式错误'; errBox.style.display = 'block'; return; }
  
  const pillars = parts.map(p => ({ gan: p[0], zhi: p[1], ganWx: GAN_WX[p[0]] }));
  const dayGan = pillars[2].gan;
  const qiyunYear = byear + 8; // 假设起运8岁
  
  const stars = getChildStars(dayGan, gender);
  const starDesc = gender === '男' ? '正官/七杀' : '食神/伤官';
  
  const signals = getHighSignals(byear, qiyunYear, dayGan, gender);
  
  let html = '';
  html += '<div class="card"><h2>基本命盘（四柱直输）</h2>';
  html += renderPan(pillars, dayGan);
  html += '<div class="info-row">';
  html += '<span>日主：<b>' + dayGan + '</b></span>';
  html += '<span>子女宫：<b>' + pillars[3].zhi + '</b></span>';
  html += '<span>起运年：<b>' + qiyunYear + '</b>（估算）</span>';
  html += '<span>流派：<b>' + starDesc + '</b></span>';
  html += '</div></div>';
  
  html += '<div class="card"><h2>120年子女星矩阵</h2>';
  html += renderMatrix(byear, qiyunYear, dayGan, gender);
  html += '<div class="legend">';
  html += '<span class="legend-item"><span class="legend-color" style="background:#FFEBEE"></span>天干透子女星</span>';
  html += '<span class="legend-item"><span class="legend-color" style="background:#E3F2FD"></span>地支藏子女星</span>';
  html += '<span class="legend-item"><span class="legend-color" style="background:#FCE4EC"></span>干支均有</span>';
  html += '</div></div>';
  
  if (signals.length > 0) {
    html += '<div class="card"><h2>子女星年份一览（共' + signals.length + '年）</h2><div class="signal-list">';
    for (let s of signals) {
      const cls = s.ganHas && s.zhiHas ? '' : (s.ganHas ? '' : 'signal-tag-zhi');
      html += '<span class="signal-tag ' + cls + '">' + s.year + '年 ' + s.gz + ' ' + s.age + '岁</span>';
    }
    html += '</div></div>';
  }
  
  document.getElementById('result-area').innerHTML = html;
}

document.getElementById('btn-run').onclick = run;
document.getElementById('btn-run2').onclick = runSizhu;
document.getElementById('tab-solar').onclick = function() { this.classList.add('active'); document.getElementById('tab-lunar').classList.remove('active'); document.getElementById('leap-field').style.display = 'none'; };
document.getElementById('tab-lunar').onclick = function() { this.classList.add('active'); document.getElementById('tab-solar').classList.remove('active'); document.getElementById('leap-field').style.display = 'flex'; };

if (document.getElementById('in-y')) run();
</script>
